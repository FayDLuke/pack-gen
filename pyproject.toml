[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-packgen"
version = "0.1.0"
description = "Builds and installs resource/behavior packs from plain folders at server start."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."endstone"]
packgen = "endstone_packgen:PackGenPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
